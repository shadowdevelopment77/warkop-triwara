name: Build Android APK (Debug Testing)

on:
  push:
    branches: [ staging, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Run tests
        run: pnpm test

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web App
        run: pnpm run build

      - name: Sync Capacitor
        run: npx exec cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cd ..
          mkdir -p dist-apks
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apks/triwara-pos-test-debug.apk
          ls -lh dist-apks/

      - name: Upload Test Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: triwara-pos-test-debug
          path: dist-apks/triwara-pos-test-debug.apk

      - name: Publish GitHub Release with Direct APK Link
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
        with:
          tag_name: latest-build
          name: "Triwara POS - APK Testing (Debug)"
          prerelease: false
          make_latest: true
          body: |
            ### 📱 Unduhan APK Triwara POS (Testing & Demo)

            Silakan unduh langsung dari HP:
            🧪 **[Download APK Testing / Debug (triwara-pos-test-debug.apk)](https://github.com/${{ github.repository }}/releases/download/latest-build/triwara-pos-test-debug.apk)**

            - Siap untuk pengujian fitur transaksi & koneksi printer thermal Bluetooth.
          files: |
            dist-apks/triwara-pos-test-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
